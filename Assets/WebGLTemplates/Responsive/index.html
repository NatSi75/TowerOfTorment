<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0b10">
    <title>Tower of Torment</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="game-root">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="loading-screen">
        <div class="loading-title">Tower of Torment</div>
        <div class="loading-bar"><div id="loading-bar-fill"></div></div>
        <div id="loading-text">Memuat... 0%</div>
      </div>

      <div id="rotate-overlay">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="20" y="8" width="24" height="44" rx="4"/><path d="M52 40a20 20 0 0 1-20 16M36 52l-4 4 4 4"/></svg>
        <p>Game ini dimainkan dalam mode <b>landscape</b>.<br>Putar perangkatmu untuk bermain.</p>
      </div>

      <div id="error-banner"></div>
    </div>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const gameRoot = document.querySelector("#game-root");
      const loadingScreen = document.querySelector("#loading-screen");
      const loadingFill = document.querySelector("#loading-bar-fill");
      const loadingText = document.querySelector("#loading-text");
      const errorBanner = document.querySelector("#error-banner");
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
        || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      if (isMobile) document.body.classList.add("is-mobile");

      function showBanner(msg, type) {
        const div = document.createElement("div");
        div.textContent = msg;
        div.className = type === "error" ? "banner-error" : "banner-warning";
        errorBanner.appendChild(div);
        if (type !== "error") setTimeout(() => div.remove(), 5000);
      }

      const buildUrl = "Build";
      const config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "game-root",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
        // Sharp on high-DPI screens, but capped so phones keep a stable frame rate.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, isMobile ? 2 : 2.5),
      };

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif

      // No fullscreen button of our own: hosts such as itch.io already provide one.
      const root = document.documentElement;
      const canFullscreen = !!(root.requestFullscreen || root.webkitRequestFullscreen);

      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }

      function enterLandscapeFullscreen() {
        if (!canFullscreen || isFullscreen()) return;
        const request = gameRoot.requestFullscreen || gameRoot.webkitRequestFullscreen;
        Promise.resolve(request.call(gameRoot)).then(() => {
          // Android browsers only allow locking the orientation while in fullscreen.
          if (isMobile && screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch(() => {});
          }
        }).catch(() => {});
      }

      // Phones/tablets: the first tap switches to fullscreen landscape automatically.
      if (isMobile) {
        document.addEventListener("pointerup", enterLandscapeFullscreen, { once: true });
      }

      // Stop the page from scrolling / zooming when dragging cards on touch screens.
      document.addEventListener("touchmove", (e) => { if (e.touches.length > 1 || e.target === canvas) e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturestart", (e) => e.preventDefault());
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
      canvas.addEventListener("pointerdown", () => canvas.focus());

      const script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          const percent = Math.round(progress * 100);
          loadingFill.style.width = percent + "%";
          loadingText.textContent = "Memuat... " + percent + "%";
        }).then(() => {
          loadingScreen.classList.add("hidden");
        }).catch((message) => {
          showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
